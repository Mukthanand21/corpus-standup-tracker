[project]
name = "corpus-standup-tracker"
version = "0.1.0"
description = "Standup Compliance Tracker for Viswam.AI / Swecha Corpus"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.54.0",
    "streamlit-searchbox>=0.1.24",
    "requests>=2.32.0",
    "python-dotenv>=1.2.0",
    "pandas>=2.3.0",
    "plotly>=5.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]
